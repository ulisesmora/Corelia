name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen --no-dev
      - name: requirements.txt está regenerado desde uv.lock
        run: uv export --no-hashes --no-dev --no-emit-project --no-header --format requirements-txt | diff - <(grep -v '^#' requirements.txt)
      - run: uv run --frozen --no-dev python manage.py makemigrations --check --dry-run
        env: { DEBUG: '1' }
      - run: uv run --frozen --no-dev python manage.py test api
        env: { DEBUG: '1' }

  panel:
    name: Panel (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # versión: campo packageManager de package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: crm/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # versión: campo packageManager de package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Imagen Docker del API + panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t corelia-api .
