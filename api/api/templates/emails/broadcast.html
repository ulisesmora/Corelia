<!DOCTYPE html>
<html>
  <head>
    <title>{{ subject }}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
      body {
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      .container {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        margin: 0 auto;
        max-width: 600px;
        width: 100%;
      }
      .logo-header {
        text-align: center;
        padding: 30px 0 10px 0;
        color: {{ brand_color }};
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 3px;
        border-bottom: 2px solid #f4f4f4;
      }
      .content-padding { padding: 40px 30px; text-align: left; }
      .greeting { font-size: 16px; color: {{ brand_color }}; font-weight: bold; margin-bottom: 20px; }
      .headline {
        color: #333333;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 20px;
        line-height: 1.3;
        text-align: center;
      }
      .body-text {
        color: #555555;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 25px;
        white-space: pre-line;
      }
      .highlight-box {
        background-color: #fcfbf9;
        border-left: 4px solid {{ brand_color }};
        padding: 20px;
        margin: 30px 0;
        color: #6d6d6d;
        font-style: italic;
        font-size: 15px;
        border-radius: 0 4px 4px 0;
      }
      .btn-container { text-align: center; margin-top: 30px; }
      .btn {
        display: inline-block;
        padding: 14px 30px;
        background-color: {{ brand_color }};
        color: #ffffff !important;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .footer {
        background-color: #f9f9f9;
        padding: 30px 20px;
        text-align: center;
        font-size: 12px;
        color: #999999;
        border-top: 1px solid #eeeeee;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td style="padding: 20px 0;" align="center">
          <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            class="container"
            style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);"
          >
            <tr>
              <td class="logo-header">{% if brand_logo %}<img src="{{ brand_logo }}" alt="{{ brand_name }}" style="max-height: 60px; max-width: 220px; border: 0;" />{% else %}{{ brand_name }}{% endif %}</td>
            </tr>
            <tr>
              <td class="content-padding">
                <div class="greeting">Hola {{ name }},</div>
                <h1 class="headline">{{ title }}</h1>
                <div class="body-text">{{ description|safe }}</div>

                {% if has_highlight %}
                <div class="highlight-box">
                  <strong>Importante:</strong><br />
                  {{ highlight }}
                </div>
                {% endif %}

                <div class="btn-container">
                  <a href="{{ web_url }}" class="btn">Visitar Web</a>
                </div>
              </td>
            </tr>
            <tr>
              <td class="footer">
                <p style="margin: 0;">{{ brand_name }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
