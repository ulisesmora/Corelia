<!DOCTYPE html>
<html>
  <head>
    <title>¡Bienvenido a {{ brand_name }}!</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
      body {
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      .container {
        background-color: #ffffff;
        margin: 0 auto;
        max-width: 600px;
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      }
      .logo-header {
        text-align: center;
        padding: 30px 0;
        color: {{ brand_color }};
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 3px;
        border-bottom: 2px solid #f9f9f9;
      }
      .content-padding { padding: 40px 30px; text-align: center; }
      .headline { color: #333333; font-size: 24px; font-weight: 700; margin: 0 0 20px 0; }
      .body-text { color: #555555; font-size: 16px; line-height: 1.6; margin-bottom: 30px; }
      .btn-container { margin: 30px 0; }
      .btn {
        background-color: {{ brand_color }};
        color: #ffffff !important;
        display: inline-block;
        font-size: 16px;
        font-weight: bold;
        line-height: 50px;
        text-align: center;
        text-decoration: none;
        width: 200px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .footer {
        background-color: #f9f9f9;
        padding: 20px;
        text-align: center;
        font-size: 12px;
        color: #999999;
        border-top: 1px solid #eeeeee;
      }
    </style>
  </head>
  <body>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td style="padding: 30px 10px;" align="center">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" class="container">
            <tr>
              <td class="logo-header">{% if brand_logo %}<img src="{{ brand_logo }}" alt="{{ brand_name }}" style="max-height: 60px; max-width: 220px; border: 0;" />{% else %}{{ brand_name }}{% endif %}</td>
            </tr>
            <tr>
              <td class="content-padding">
                <h1 class="headline">{{ headline }}</h1>
                <div class="body-text">
                  Hola {{ name }},<br /><br />
                  {{ intro_copy }}
                </div>
                <div class="btn-container">
                  <a href="{{ cta_url }}" class="btn">{{ cta_text }}</a>
                </div>
              </td>
            </tr>
            <tr>
              <td class="footer">
                <p style="margin: 0;">El equipo de {{ brand_name }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
