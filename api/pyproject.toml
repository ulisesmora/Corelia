# Dependencias del API (Django). Se gestionan con uv: https://docs.astral.sh/uv/
#
#   uv sync                         # crea .venv con las versiones exactas de uv.lock
#   uv run python manage.py test api
#   uv add paquete==x.y             # añadir/subir una dependencia (actualiza uv.lock)
#
# requirements.txt se genera desde uv.lock para quien prefiera pip:
#   uv export --no-hashes --no-dev --no-emit-project --format requirements-txt -o requirements.txt

[project]
name = "corelia-api"
version = "0.1.0"
description = "API + panel de Corelia (Django)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Núcleo
    "Django==5.2.18",                    # LTS (soporte hasta abril de 2028)
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "django-filter==26.2",
    "django-cors-headers==4.9.0",
    "drf-spectacular==0.30.0",
    "whitenoise==6.12.0",
    "python-dotenv==1.2.2",
    "tzdata==2025.3",

    # Base de datos y tareas programadas
    "psycopg[binary]==3.2.3",
    "celery==5.6.3",
    "redis==7.1.0",

    # Servidor
    "granian==2.7.5",
    "uvloop==0.22.1",

    # Funcionalidad
    "stripe==13.0.1",
    "pillow==12.3.0",
    "orjson==3.11.9",
    "pywebpush>=2.0",
    "cryptography>=44",
    "requests>=2.32",
    "google-auth>=2.30",                 # verificar el login con Google

    # Opcionales (solo se usan si se configuran)
    "sentry-sdk[django]>=2.35,<3.0",
]

[tool.uv]
package = false
